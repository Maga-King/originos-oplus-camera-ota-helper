name: 构建完整 Windows 工具
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 同时发布完整工具和当前源码到 Release
        type: boolean
        default: true
permissions:
  contents: write
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 下载完整固定版素材（不是下载别人的已生成相机模块）
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.2-preview --repo Maga-King/originos-oplus-camera-ota-helper --pattern 'OriginOSCameraOTA-v0.1.2-preview-windows-full.zip' --dir .materials
          python -c "import zipfile; zipfile.ZipFile('.materials/OriginOSCameraOTA-v0.1.2-preview-windows-full.zip').extractall('.materials/unpacked')"
          python restore_release_materials.py --portable .materials/unpacked/OriginOSCameraOTA
      - name: 安装 Python 构建依赖
        run: python -m pip install -r requirements.txt
      - name: 源码测试与重新编译 EXE
        working-directory: tools/OriginOSCameraOTA
        run: |
          python -m unittest discover -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm OriginOSCameraOTA.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 打包全部运行材料并检查 EXE
        run: python ci/package_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: OriginOSCameraOTA-Windows-完整工具
          path: out/OriginOSCameraOTA-windows-complete.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: 发布已成功构建的完整成品
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip --prefix=originos-oplus-camera-ota-helper/ --output=out/OriginOSCameraOTA-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tag = "ci-$env:GITHUB_RUN_NUMBER"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "完整 Windows 工具：云端构建 $env:GITHUB_RUN_NUMBER" --notes-file ci/发布说明.md --prerelease
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag out/OriginOSCameraOTA-windows-complete.zip out/OriginOSCameraOTA-source.zip --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
